services:
  # Backend API
  - type: web
    name: gridiron-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gridiron-db
          property: connectionString
      - key: AUTH0_DOMAIN
        sync: false   # set manually in Render dashboard
      - key: AUTH0_AUDIENCE
        value: https://gridiron-stats-api
      - key: FRONTEND_URL
        sync: false   # set manually after frontend deploys

  # Frontend (Static Site)
  - type: web
    name: gridiron-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        value: https://gridiron-stats-api
      - key: VITE_API_URL
        sync: false   # set to your backend URL after it deploys

databases:
  - name: gridiron-db
    databaseName: gridiron_stats
    user: gridiron
    plan: free
